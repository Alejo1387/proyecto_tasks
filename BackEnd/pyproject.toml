[project]
name = "tasktracker-backend"
version = "0.1.0"
description = "Backend para TaskTracker - Gestor de tareas profesional"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.0",
    "PyJWT==2.8.0",
    "python-multipart==0.0.6",
    "email-validator==2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
